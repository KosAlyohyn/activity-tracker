plugins:
  - rubocop-rails
  - rubocop-rspec
  - rubocop-performance
  - rubocop-thread_safety
  - rubocop-factory_bot
  - rubocop-rspec_rails

# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

AllCops:
  NewCops: enable

FactoryBot/SyntaxMethods:
  Enabled: false

RSpecRails/InferredSpecType:
  Enabled: false

FactoryBot/AssociationStyle:
  EnforcedStyle: explicit

RSpec/MultipleExpectations:
  Max: 2

# String literals
Style/FrozenStringLiteralComment:
  Enabled: false

# Layout
Layout/LineLength:
  Enabled: true
  Max: 120

# Metrics
Metrics/MethodLength:
  Enabled: true
  Max: 15

Metrics/ClassLength:
  Enabled: true
  Max: 150

Metrics/BlockLength:
  Enabled: true
  Exclude:
    - "spec/**/*"
    - "config/routes.rb"
    - "db/migrate/**/*"

Metrics/AbcSize:
  Enabled: true
  Max: 20

Metrics/CyclomaticComplexity:
  Enabled: true
  Max: 7

Metrics/PerceivedComplexity:
  Enabled: true
  Max: 8
