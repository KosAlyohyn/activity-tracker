default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "activity_tracker") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "") %>

development:
  <<: *default
  database: activity_tracker_development

test:
  <<: *default
  database: activity_tracker_test

production:
  primary: &primary_production
    <<: *default
    database: activity_tracker_production
  cache:
    <<: *primary_production
    database: activity_tracker_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: activity_tracker_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: activity_tracker_production_cable
    migrations_paths: db/cable_migrate
