services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: activity_tracker
      POSTGRES_PASSWORD: development_password
      POSTGRES_DB: activity_tracker_development
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activity_tracker -d activity_tracker_development"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: bin/rails server -b 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_USERNAME: activity_tracker
      DATABASE_PASSWORD: development_password
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  postgres_data:
